# File di configurazione mdtcap — operatore: Vodafone Italia
#
# Porte/--autodetect/--qcsuper NON vanno qui: sono parametri di SISTEMA
# (dipendono dalla macchina/dal collegamento hardware, non dall'operatore
# della SIM) — vedi mdt_configs/system.conf, caricato automaticamente
# prima di questo file (precedenza piu' bassa: system.conf < --op).
#
# APN pubblico Vodafone IT (consumer/internet): web.omnitel.it
# Nessun --sim-pin: il PIN non e' uguale per tutte le SIM Vodafone — va
# fornito manualmente se la SIM lo richiede (riga "--sim-pin XXXX" sotto).
#
# Durata 1800s (30 minuti): vedi nota nella GUIDA (sezione 2) sul perche'
# una cattura piu' corta rischia di non coprire l'intervallo con cui
# l'operatore invia le eventuali richieste MDT.
#
# --outdir non incluso: in conflitto con --outdir-base.
# -v/--verbose-interval e --parla-chiaro esclusi di proposito.

--outdir-base /root/mdt_evidence/vodafone

--duration 1800

--apn web.omnitel.it
--force-lte
--require-lte
--lte-wait 30

--gps-wait 30
--net-attach-wait 30
--lbs

--report
--beep

--label "test MDT 30min - Vodafone Italia (APN web.omnitel.it, LTE forzato/verificato)"
