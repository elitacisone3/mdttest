# File di configurazione mdtcap — operatore: WindTre
#
# Porte/--autodetect/--qcsuper NON vanno qui: sono parametri di SISTEMA
# (dipendono dalla macchina/dal collegamento hardware, non dall'operatore
# della SIM) — vedi mdt_configs/system.conf, caricato automaticamente
# prima di questo file (precedenza piu' bassa: system.conf < --op).
#
# APN pubblico WindTre (consumer/internet): internet.wind
# Per SIM originariamente "Tre"/3 (pre-fusione) l'APN puo' essere invece
# internet.tre.it: se questo file non porta all'attach dati, provare
# quello sostituendo il valore di --apn.
# Nessun --sim-pin: va fornito manualmente se la SIM lo richiede (riga
# "--sim-pin XXXX" sotto).
#
# Durata 1800s (30 minuti): vedi nota nella GUIDA (sezione 2) sul perche'
# una cattura piu' corta rischia di non coprire l'intervallo con cui
# l'operatore invia le eventuali richieste MDT.
#
# --outdir non incluso: in conflitto con --outdir-base.
# -v/--verbose-interval e --parla-chiaro esclusi di proposito.

--outdir-base /root/mdt_evidence/windtre

--duration 1800

--apn internet.wind
--force-lte
--require-lte
--lte-wait 30

--gps-wait 30
--net-attach-wait 30
--lbs

--report
--beep

--label "test MDT 30min - WindTre (APN internet.wind, LTE forzato/verificato)"
