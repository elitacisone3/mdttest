# File di configurazione mdtcap — operatore: Turk Telekom (Turchia)
#
# Porte/--autodetect/--qcsuper NON vanno qui: sono parametri di SISTEMA
# (dipendono dalla macchina/dal collegamento hardware, non dall'operatore
# della SIM) — vedi mdt_configs/system.conf, caricato automaticamente
# prima di questo file (precedenza piu' bassa: system.conf < --op).
#
# APN pubblico Turk Telekom (consumer/internet): internet
# (MCC 286 / MNC 03, confermato anche da AT+CIMI sulla SIM in uso:
# IMSI 123456789012345, ICCID 12345678901234567890)
#
# Nessun --sim-pin: AT+CPIN? su questa SIM risulta gia' READY (nessun
# PIN da inserire).
#
# Durata 1200s (20 minuti) su richiesta specifica, invece dei 1800s
# (30 min) usati per gli altri operatori — vedi nota nella GUIDA
# (sezione 2) sul compromesso fra durata e copertura dell'intervallo
# con cui l'operatore invia le eventuali richieste MDT.
#
# --outdir non incluso: in conflitto con --outdir-base.
# -v/--verbose-interval e --parla-chiaro esclusi di proposito.
#
# ATTENZIONE (verificato sul campo, vedi sessione di test):
# questa SIM e' un abbonamento Turk Telekom (Turchia). Interrogando il
# modem da questa postazione (rig di test in Italia, stessa usata per
# le SIM iliad/tim/vodafone/windtre) con AT+COPS=? risultano visibili
# SOLO operatori italiani (I WIND, ILIAD, 3 ITA, I TIM, vodafone IT) —
# nessun operatore compare come "available" per questa SIM, e
# AT+COPS=0 (selezione automatica) termina con COPS: 2 (deregistrata) /
# CEREG: 0,4 (fuori copertura E-UTRAN) anche dopo reset radio (CFUN 0/1).
# In pratica: qui la SIM non trova alcuna rete con cui agganciarsi
# (assenza di roaming utilizzabile in questa location), quindi una
# cattura con --require-lte abortira' allo scadere di --lte-wait
# (exit 2) senza mai avviare qcsuper. Il file e' pronto per quando la
# SIM sara' testata in un'area con copertura Turk Telekom o di un suo
# partner di roaming.

--outdir-base /root/mdt_evidence/turktelekom

--duration 1200

--apn internet
--force-lte
--require-lte
--lte-wait 30

--gps-wait 30
--net-attach-wait 30
--lbs

--report
--beep

--label "test MDT 20min - Turk Telekom (APN internet, LTE forzato/verificato)"
