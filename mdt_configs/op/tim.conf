# File di configurazione mdtcap — operatore: TIM
#
# Porte/--autodetect/--qcsuper NON vanno qui: sono parametri di SISTEMA
# (dipendono dalla macchina/dal collegamento hardware, non dall'operatore
# della SIM) — vedi mdt_configs/system.conf, caricato automaticamente
# prima di questo file (precedenza piu' bassa: system.conf < --op).
#
# APN pubblico TIM (consumer/internet): ibox.tim.it
# Nessun --sim-pin: a differenza di Iliad, TIM non usa un PIN di default
# uguale per tutte le SIM — va fornito manualmente se la SIM lo richiede
# (aggiungere una riga "--sim-pin XXXX" sotto se necessario).
#
# Durata 1800s (30 minuti): l'MDT e' una funzione attivata dall'operatore
# a intervalli, non ad ogni connessione — ad es. TIM Analytics invia le
# richieste di misura MDT ogni ~15 minuti, quindi una cattura piu' corta
# rischia di non coprire l'intervallo giusto (vedi GUIDA, sezione 2).
#
# --outdir non incluso: in conflitto con --outdir-base.
# -v/--verbose-interval e --parla-chiaro esclusi di proposito.

--outdir-base /root/mdt_evidence/tim

--duration 1800

--apn ibox.tim.it
--force-lte
--require-lte
--lte-wait 30

--gps-wait 30
--net-attach-wait 30
--lbs

--report
--beep

--label "test MDT 30min - TIM (APN ibox.tim.it, LTE forzato/verificato)"
