# Profilo di test mdtcap — "reconnect-trap"
#
# Test lungo (60 minuti) con la "trappola" per la riconnessione: ogni 5
# minuti forza un nuovo attach (ciclo radio AT+CFUN=0/1) SENZA fermare la
# cattura, per aumentare le occasioni di osservare un eventuale invio
# della configurazione MDT — che tipicamente viaggia dentro la
# RRCConnectionReconfiguration successiva a un nuovo attach (vedi GUIDA,
# sezione "Trappola per la riconnessione"). --reconnects 10 mette un
# tetto massimo ai cicli (10 su 60 minuti con intervallo 300s ne servono
# al piu' 12, quindi il tetto qui e' puramente precauzionale: evita cicli
# radio illimitati se la durata venisse allungata senza toccare questo
# profilo).
#
# Pensato per essere combinato con --op (che imposta APN/operatore/
# --outdir-base/--force-lte/--require-lte): questo profilo NON tocca
# --apn/--outdir-base/--sim-pin, solo la "forma" del test.
#
# --tui/--mdt-led NON sono inclusi qui (vanno sempre passati
# esplicitamente sulla riga di comando, mai nei file di configurazione):
# aggiungili a mano se li vuoi, es.
# "sudo ./mdtcap --profile reconnect-trap --tui --mdt-led" (--mdt-led
# resta senza effetto, con un avviso, senza --tui).

--duration 3600

--require-lte
--lte-wait 30
--reconnect-interval 300
--reconnects 10

--gps-wait 30
--net-attach-wait 30

--report
--parla-chiaro
--beep

--label "test MDT con trappola riconnessione (profilo reconnect-trap) - 60 minuti, ciclo ogni 5min"
