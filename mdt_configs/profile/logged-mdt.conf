# Profilo di test mdtcap — "logged-mdt"
#
# Test lungo (60 minuti) pensato per il Logged MDT, che la rete configura
# in connected (loggedMeasurementConfiguration), l'UE misura in IDLE e la
# rete recupera alla riconnessione successiva (logMeasAvailable nel
# SetupComplete, poi UEInformationRequest con logMeasReportReq). Servono
# quindi cicli connected -> idle -> connected con fasi idle lunghe:
# --idle-cycle 600 riporta l'UE in connected ogni 10 minuti con un solo
# ping, SENZA detach (a differenza di reconnect-trap, i cui cicli
# AT+CFUN fanno un detach dopo il quale l'UE puo' scartare
# configurazione e log). Il ritorno in idle e' lasciato al timer di
# inattivita' della rete.
#
# GNSS acceso (--gps-wait): confrontare con logged-mdt-nognss, stesso
# test con il GNSS spento, perche' la posizione viene inclusa nei report
# MDT solo se disponibile e la rete potrebbe comportarsi diversamente.
# Conviene ripetere entrambi da fermi e in movimento: la mobilita'
# rilevata e lo stato del GNSS finiscono nel manifest.json.
#
# --full-scan: rileva anche obtainLocationConfig, mobilityHistoryReportReq,
# logMeasAvailable, LPP e la configurazione dei measurement report.
#
# Pensato per essere combinato con --op (APN/operatore/--outdir-base/
# --force-lte/--require-lte): questo profilo non tocca --apn/--outdir-base/
# --sim-pin. --tui/--mdt-led vanno passati sulla riga di comando.

--duration 3600

--require-lte
--lte-wait 30
--idle-cycle 600

--gps-wait 30
--net-attach-wait 30

--full-scan

--report
--parla-chiaro
--beep

--label "test Logged MDT (profilo logged-mdt) - 60 minuti, ciclo idle ogni 10min, GNSS acceso"
