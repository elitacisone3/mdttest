# Profilo di test mdtcap — "quick"
#
# Test funzionale rapido: verifica che porte/APN/LTE/GPS/report funzionino
# correttamente, SENZA pretesa di osservare davvero l'MDT (la finestra e'
# troppo breve — vedi GUIDA, sezione 2, sul perche' servano almeno 30
# minuti per un test attendibile). Da usare per un controllo veloce prima
# di lanciare un test lungo con il profilo "standard", o dopo una
# modifica alla configurazione hardware/rete.
#
# Pensato per essere combinato con --op (che imposta APN/operatore/
# --outdir-base): questo profilo NON tocca --apn/--outdir-base/--sim-pin,
# solo la "forma" del test (durata, GPS, UI, report).
#
# --tui NON e' incluso qui (va sempre passato esplicitamente sulla riga
# di comando, mai nei file di configurazione): aggiungilo a mano se lo
# vuoi, es. "sudo ./mdtcap --profile quick --tui".

--duration 120

--gps-wait 20
--net-attach-wait 20

--report
--parla-chiaro
--beep

--label "test rapido (profilo quick) - solo verifica funzionale, non attendibile per l'MDT"
