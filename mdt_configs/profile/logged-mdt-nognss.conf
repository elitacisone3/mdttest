# Profilo di test mdtcap — "logged-mdt-nognss"
#
# Identico a logged-mdt (vedi li' per il perche' dei cicli idle senza
# detach), ma con il GNSS del modulo SPENTO per tutta la cattura
# (--gnss-off, che ha la precedenza su un eventuale --gps-wait ereditato
# da --op): serve a confrontare il comportamento della rete con e senza
# una posizione GNSS disponibile per i report MDT. Lo stato del GNSS
# durante la cattura e' registrato nel manifest.json ("gnss").
#
# Pensato per essere combinato con --op, come logged-mdt.

--duration 3600

--require-lte
--lte-wait 30
--idle-cycle 600

--gnss-off
--net-attach-wait 30

--full-scan

--report
--parla-chiaro
--beep

--label "test Logged MDT senza GNSS (profilo logged-mdt-nognss) - 60 minuti, ciclo idle ogni 10min"
