# Profilo di test mdtcap — "standard"
#
# Test MDT attendibile: 30 minuti (1800s), la durata minima consigliata
# nella GUIDA (sezione 2) perche' la finestra copra almeno 2 degli
# intervalli con cui un operatore invia le eventuali richieste MDT.
# GPS e attach dati con attesa, LBS, report tecnico + parla-chiaro.
#
# Pensato per essere combinato con --op (che imposta APN/operatore/
# --outdir-base/--force-lte/--require-lte): questo profilo NON tocca
# --apn/--outdir-base/--sim-pin/--force-lte/--require-lte, solo la
# "forma" del test (durata, GPS, attach, LBS, UI, report).
#
# --tui NON e' incluso qui (va sempre passato esplicitamente sulla riga
# di comando, mai nei file di configurazione): aggiungilo a mano se lo
# vuoi, es. "sudo ./mdtcap --profile standard --tui".

--duration 1800

--gps-wait 30
--net-attach-wait 30
--lbs

--report
--parla-chiaro
--beep

--label "test MDT standard (profilo standard) - 30 minuti"
