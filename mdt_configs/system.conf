# File di configurazione mdtcap — SISTEMA (questa macchina/questo collegamento)
#
# GENERATO da: sudo ./install.sh --configure-system
# il 2026-09-08T15:59:07Z. Rigenerato per intero ad ogni uso di
# --configure-system: non aggiungere qui altro oltre a
# porte/--autodetect/--qcsuper/VID-PID USB (parametri di SISTEMA —
# dipendono dalla macchina/dal collegamento hardware, non da operatore o
# tipo di test: per quelli vedi mdt_configs/op/*.conf e
# mdt_configs/profile/*.conf).
#
# Caricato automaticamente da mdtcap ad ogni esecuzione (nessuna opzione
# da passare), con la precedenza piu' bassa fra i livelli di
# configurazione (system.conf < --op < --profile < --config < riga di
# comando): valori passati esplicitamente sulla riga di comando vincono
# sempre su questo file.
#
# --usb-modem-vid/--usb-modem-pid: usati da mdtcap SOLO se lanciato con
# --usb-modem (facoltativo, vedi mdtcap --help) — assenti qui se il
# rilevamento non e' riuscito, mdtcap si ferma con un errore chiaro se
# --usb-modem viene comunque richiesto in quel caso.

--autodetect
--qcsuper /usr/local/bin/qcsuper
--usb-modem-vid 1e0e
--usb-modem-pid 9000
