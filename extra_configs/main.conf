# extra_configs/main.conf — soglie/regole di DEFAULT per src/extra_scan
# (mdtcap --extended), valide per qualunque operatore/profilo.
#
# Ordine di lettura (mdtcap --extended --ext-profile NOME, con --op NOME2
# o auto-rilevato via MCC-MNC):
#
#   main.conf  ->  extra_configs/op/<NOME2>.conf  ->  extra_configs/profile/<NOME>.conf
#
# Ognuno dei tre puo' sovrascrivere/aggiungere sezioni o singole chiavi
# rispetto al precedente (stessa identica convenzione di
# mdt_configs/system.conf < --op < --profile — vedi li' per il perche':
# un file "letto dopo" e' una specializzazione via via piu' vicina al
# test specifico, dal generico system.conf/main.conf fino al singolo
# --profile). Non serve ripetere qui una sezione se non la si vuole
# modificare: op/profile possono limitarsi alle sole chiavi che
# cambiano.
#
# Formato: INI (Python configparser). Una SEZIONE per singola regola/
# evento sospetto, non per categoria: una categoria (SMSSTK/NASId/
# RRCCiph/cellSys/GPSLoc/WCDMA3G — vedi "extra_scan --get-defs" per
# l'elenco autorevole, sempre aggiornato) puo' avere piu' regole
# indipendenti. Nome sezione: "<CATEGORIA>.<evento>".
#
# Chiavi per sezione (tutte facoltative tranne "level"):
#   level          I (ignora) / W (avviso semplice) / C (cumulativo:
#                  vedi cum_threshold) / A (assoluto, malevolo certo)
#   enabled        true/false (default true) — disattiva la regola senza
#                  cancellarla
#   min            occorrenze grezze minime nella finestra prima che la
#                  regola "scatti" (default 1)
#   max            occorrenze grezze oltre le quali si considera un
#                  comportamento diverso/non piu' significativo (raro,
#                  facoltativo)
#   window_s       finestra temporale in secondi entro cui contare min/
#                  max/cum_threshold (default: intera cattura — vedi
#                  [DEFAULT] sotto)
#   cum_threshold  soglia di occorrenze A LIVELLO "C" oltre la quale la
#                  regola viene PROMOSSA a "A" nell'aggregato finale (le
#                  singole righe di log restano "C", solo il livello
#                  aggregato della regola/categoria sale ad "A")
#   min_interval_s / max_interval_s
#                  per regole basate sull'intervallo fra un evento e il
#                  successivo (es. riallocazione GUTI), invece che sul
#                  conteggio grezzo
#   mode           stringa libera, letta dal singolo detector Python per
#                  varianti comportamentali (facoltativo, non usato da
#                  tutte le regole)
#   comment        commento libero mostrato nel report esteso
#                  (extra_scan_report.txt), non nei log compatti
#   log_msg        template Python "%"-string per il messaggio di log di
#                  QUESTA regola, con placeholder popolati dal detector
#                  (es. %(tp_dcs)s, %(orig)s) — se assente si usa un
#                  messaggio di default generico basato su "comment"
#
# "Se ritieni ci debbano essere valori in piu' aggiungili" (indicazione
# esplicita del committente): questo file e le regole sotto sono un
# punto di partenza per una DISCRIMINAZIONE INIZIALE, non un verdetto
# definitivo — pensato per essere esteso/corretto nel tempo (nuova
# sezione INI + eventuale piccolo detector in src/extra_scan, senza
# toccare il motore di aggregazione).

[DEFAULT]
enabled = true
window_s = 900

# ---- SMSSTK: SMS/STK -------------------------------------------------

[SMSSTK.silent_sms]
# TP-DCS (TS 23.038) Class 0 (flash, mostrato e non salvato) o Class 2
# (destinato alla SIM, tipico di OTA/STK) senza contenuto testuale
# visibile: SMS "silenziosa", usata per trigger nascosti (posizione,
# beacon di presenza, ecc.). Isolata e non necessariamente malevola
# (anche notifiche legittime di operatore la usano): livello W, sale a
# rischio "cumulativo" solo se ripetuta piu' volte nella stessa cattura.
level = W
min = 1
cum_threshold = 5
comment = SMS silenziosa (TP-DCS class 0/2) - possibile trigger nascosto
log_msg = SMS silenziosa rilevata (TP-DCS=0x%(tp_dcs)02x)

[SMSSTK.simjacker_envelope]
# Abuso del SIM Toolkit via SMS binaria (classe di attacco SIMjacker/
# WIB): un envelope STK ricevuto via SMS-PP che assomiglia a comandi
# PROVIDE LOCAL INFORMATION / SEND SHORT MESSAGE non richiesti
# dall'utente. Nessuna soglia: un solo evento e' gia' un segnale forte.
level = A
min = 1
comment = Possibile SIMjacker/WIB: comando STK sospetto in SMS-PP

# ---- NASId: NAS/Identita' ---------------------------------------------

[NASId.test_sms_forced]
# Vedi RRCCiph.test_sms_forced sopra: stesso meccanismo, categoria diversa.
level = A
min = 1
comment = Trigger di test via SMS magica (--test-sms) - non un evento di rete reale

[NASId.unsolicited_identity_imsi]
# Identity Request di tipo IMSI (nas-eps.emm.id_type2=1) non preceduta,
# nella stessa procedura, da un Authentication Request: tipico di un
# IMSI-catcher che vuole l'IMSI in chiaro prima di lasciar cadere la
# sessione. Un singolo caso puo' capitare per motivi legittimi (rete che
# ha perso il contesto); ripetuto piu' volte e' un segnale forte.
level = C
min = 1
cum_threshold = 3
comment = Identity Request IMSI non sollecitata (possibile IMSI catcher)

[NASId.attach_identity_release]
# Pattern Attach Request -> Identity Request -> Detach/Release quasi
# immediato: tipico "grab and release" di un catcher che non intende
# fornire servizio reale.
level = W
min = 1
comment = Pattern Attach -> Identity -> Release immediato

[NASId.guti_realloc_anomaly]
# Riallocazione GUTI (GUTI reallocation command) troppo frequente
# (sotto min_interval_s) e' anomala quanto il caso opposto (mai
# riallocato durante una cattura molto lunga, oltre max_interval_s):
# entrambi gli estremi sono trattati come "warning", il detector decide
# quale caso si applica in base ai timestamp osservati.
level = W
min_interval_s = 60
max_interval_s = 3600
comment = Riallocazione GUTI troppo frequente o mai avvenuta nella sessione

# ---- RRCCiph: RRC/Cifratura --------------------------------------------

[RRCCiph.test_sms_forced]
# Trigger di test via SMS magica (mdtcap --test-sms, vedi
# src/extra_scan detect_test_sms_trigger): NON un evento di rete reale,
# forzato al livello A a prescindere da questo file (extra_scan sovrascrive
# level/min in memoria quando --test-sms e' attivo) - i valori qui sotto
# sono solo documentazione del comportamento atteso.
level = A
min = 1
comment = Trigger di test via SMS magica (--test-sms) - non un evento di rete reale

[RRCCiph.eea0_eia0]
# Cifratura e/o integrita' NULL (EEA0/EIA0) nel Security Mode Command
# RRC (AS security): il segnale singolo a PIU' alta confidenza fra
# tutti quelli qui elencati (nessuna rete legittima in produzione
# dovrebbe proporre EEA0 salvo eccezioni normative locali per le
# chiamate d'emergenza, non applicabili qui). Un solo evento e' gia'
# "Assoluto".
level = A
min = 1
comment = Cifratura/integrita' nulla (EEA0/EIA0) in Security Mode Command RRC

# ---- cellSys: Cella/Sistema --------------------------------------------

[cellSys.test_sms_forced]
# Vedi RRCCiph.test_sms_forced sopra: stesso meccanismo, categoria diversa.
level = A
min = 1
comment = Trigger di test via SMS magica (--test-sms) - non un evento di rete reale

[cellSys.forced_2g_downgrade]
# redirectedCarrierInfo verso una cella 2G/GSM in RRCConnectionRelease:
# tecnica nota per forzare l'UE su una rete piu' debole (2G, spesso
# senza le stesse protezioni di autenticazione mutua di LTE).
level = C
min = 1
cum_threshold = 2
comment = Redirect forzato verso 2G (redirectedCarrierInfo)

[cellSys.no_neighbor_list]
# Assenza di una neighbor cell list nei SIB della cella servente: una
# cella "isolata" (nessun vicino dichiarato) e' un tratto tipico di
# alcuni simulatori di cella economici, ma capita anche per
# configurazioni di rete legittime marginali: solo un avviso semplice.
level = W
min = 1
comment = Assenza neighbor cell list nei SIB della cella servente

# ---- GPSLoc: GPS/Localizzazione -----------------------------------------

[GPSLoc.cell_gps_incoherent]
# Cell ID/PCI che cambia in modo incoerente con la traccia GPS
# registrata nella stessa cattura (periodic_cell_gps_decoded.csv): es.
# la cella cambia ripetutamente pur restando fermi, o resta identica
# nonostante uno spostamento significativo — entrambi i casi possono
# indicare una cella non genuina nell'area.
level = W
min = 1
comment = Cell ID/PCI incoerente con la traccia GPS registrata

# ---- WCDMA3G: 3G/UMTS ----------------------------------------------------

[WCDMA3G.test_sms_forced]
# Vedi RRCCiph.test_sms_forced sopra: stesso meccanismo, categoria diversa.
level = A
min = 1
comment = Trigger di test via SMS magica (--test-sms) - non un evento di rete reale

[WCDMA3G.a5_0_2g]
# A5/0 (nessuna cifratura) accettato su GSM/2G in Cipher Mode Command:
# equivalente 2G di RRCCiph.eea0_eia0, stessa confidenza massima.
level = A
min = 1
comment = A5/0 (nessuna cifratura) accettato su GSM/2G

[WCDMA3G.forced_3g_downgrade]
# Redirect/handover forzato verso UMTS/3G quando la cella servente era
# LTE con segnale adeguato: variante 3G dello stesso schema di
# downgrade di cellSys.forced_2g_downgrade.
level = W
min = 1
cum_threshold = 3
comment = Redirect/handover forzato verso 3G/UMTS
