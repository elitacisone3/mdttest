# extra_configs/full_scan.conf — regole di DEFAULT del gruppo "full" di
# src/extra_scan (mdtcap --full-scan), valide per qualunque operatore/
# profilo. Gruppo SEPARATO da quello di --extended (main.conf): stesso
# formato, stesse chiavi (vedi l'intestazione di main.conf), stesso
# ordine di lettura, ma con questo file al posto di main.conf:
#
#   full_scan.conf  ->  extra_configs/op/<OP>.conf  ->  extra_configs/profile/<NOME>.conf
#
# op/profile possono quindi sovrascrivere anche queste regole
# (sezioni "<CATEGORIA>.<evento>" con le categorie sotto); le sezioni
# delle categorie di --extended eventualmente presenti negli stessi file
# vengono ignorate da questo gruppo, e viceversa.
#
# Categorie (vedi "extra_scan --get-defs --set full"):
#   MDTExt   IE MDT/posizione oltre a quelli gia' cercati da mdtcap
#   LPP      posizionamento LPP dentro i Generic NAS Transport
#   MeasCfg  configurazione dei measurement report (INDICATORE)
#   UECap    UECapabilityInformation inviata dall'UE
#
# Chiavi specifiche di alcuni rilevatori (oltre a quelle di main.conf),
# lette dalla sezione della regola:
#   MeasCfg.dense_periodic_stationary: max_interval_ms, min_report_amount,
#                                       min_report_cells
#   MeasCfg.report_rate_stationary:    max_reports_per_min

[DEFAULT]
enabled = true
window_s = 900

# ---- MDTExt: IE MDT/posizione estesi --------------------------------

[MDTExt.obtain_location]
# OtherConfig-r9 -> obtainLocationConfig-r11 (in una
# RRCConnectionReconfiguration): la rete chiede esplicitamente all'UE di
# attivare il ricevitore GNSS per avere una posizione da includere nei
# report. Nessun uso legittimo che non sia la localizzazione dell'UE.
level = A
comment = La rete chiede all'UE di attivare il GNSS (obtainLocationConfig-r11)

[MDTExt.mobility_history_req]
# UEInformationRequest con mobilityHistoryReportReq-r12: richiesta dello
# storico delle celle visitate con i tempi di permanenza (di fatto uno
# storico degli spostamenti).
level = A
comment = La rete chiede lo storico celle/tempi dell'UE (mobilityHistoryReportReq-r12)

[MDTExt.mobility_history_report]
level = A
comment = L'UE consegna lo storico celle/tempi (mobilityHistoryReport-r12)

[MDTExt.log_meas_available]
# logMeasAvailable in RRCConnectionSetupComplete/
# ReestablishmentComplete/ReconfigurationComplete: l'UE ha misure Logged
# MDT registrate in idle e pronte da consegnare. Di per se' informativo
# (la configurazione e' gia' stata vista o e' precedente alla cattura),
# ma conferma un Logged MDT attivo: contato anche nel report di copertura
# (coverage_report.txt), accanto ai cicli idle.
level = I
comment = L'UE dichiara misure MDT registrate da consegnare (logMeasAvailable)

[MDTExt.location_in_measconfig]
# includeLocationInfo-r10/r11 in una ReportConfigEUTRA: i measurement
# report (Immediate MDT) devono includere la posizione dell'UE.
level = C
cum_threshold = 3
comment = Una reportConfig chiede la posizione nei measurement report (includeLocationInfo)

# ---- LPP: posizionamento via NAS ------------------------------------

[LPP.location_request]
level = A
comment = La rete chiede la posizione all'UE via LPP (RequestLocationInformation)

[LPP.location_provide]
level = A
comment = L'UE invia la propria posizione via LPP (ProvideLocationInformation)

[LPP.capability_request]
# Richiesta delle sole capability di posizionamento: preliminare a una
# sessione LPP, ma anche usata per l'E911/112 e il provisioning.
level = W
comment = La rete chiede le capability di posizionamento LPP dell'UE

[LPP.container]
level = I
comment = Contenitore LPP in un Generic NAS Transport

# ---- MeasCfg: configurazione dei measurement report -----------------
# INDICATORI, non prove: la rete configura report periodici anche per
# ottimizzazione/SON. Diventano significativi a terminale fermo (nessuna
# mobilita' che li giustifichi) e soprattutto confrontati, in modalita'
# federata, con la baseline della stessa cella/operatore.

[MeasCfg.periodic_report_config]
level = I
comment = reportConfig periodica ricevuta

[MeasCfg.dense_periodic_stationary]
level = W
max_interval_ms = 2048
min_report_amount = 16
min_report_cells = 3
comment = Reporting periodico fitto su molte celle a terminale fermo

[MeasCfg.report_rate_stationary]
level = W
max_reports_per_min = 6
comment = Measurement report frequenti a terminale fermo

# ---- UECap: UECapabilityInformation ---------------------------------

[UECap.mdt_capable]
# Informativo, ma determinante per l'esito: un UE che NON dichiara
# loggedMeasurementsIdle-r10 non riceve mai una configurazione Logged
# MDT, quindi la sua assenza non dimostra nulla: e' una delle limitazioni
# elencate nel report di copertura (coverage_report.txt).
level = I
comment = L'UE dichiara il supporto al Logged MDT (loggedMeasurementsIdle-r10)

[UECap.capability_changed]
level = W
comment = UECapabilityInformation diversa dalla sessione precedente dello stesso IMEI

[UECap.no_capability]
level = I
comment = Nessuna UECapabilityInformation inviata durante la cattura
