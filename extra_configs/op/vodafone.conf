# extra_configs/op/vodafone.conf — override extra_scan per operatore:
# Vodafone Italia (MCC-MNC 222-10, stesso operatore di
# mdt_configs/op/vodafone.conf/mdt_configs/mcc-mnc/222-10).
#
# Letto DOPO main.conf (vedi ordine di lettura li'): puo' limitarsi alle
# sole sezioni/chiavi che vuole cambiare. Esempio concreto sotto: nessun
# dato reale sul comportamento di questo operatore, e' solo un esempio
# di come restringere una soglia per un operatore specifico (es. se
# l'esperienza sul campo mostra che le Identity Request IMSI isolate
# sono piu' rare del solito su questa rete, si puo' abbassare la soglia
# di promozione C->A rispetto al default di main.conf).

[NASId.unsolicited_identity_imsi]
level = C
min = 1
cum_threshold = 2
comment = Identity Request IMSI non sollecitata (soglia ridotta per Vodafone IT, vedi commento file)
