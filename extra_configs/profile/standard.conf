# extra_configs/profile/standard.conf — profilo "standard" per
# src/extra_scan (mdtcap --extended --ext-profile standard).
#
# Letto DOPO main.conf ed eventuale extra_configs/op/<operatore>.conf
# (vedi ordine di lettura in main.conf): puo' limitarsi a sovrascrivere
# solo le chiavi che vuole cambiare, non serve ripetere sezioni intere.
#
# Questo profilo non modifica nessuna soglia rispetto a main.conf: e'
# pensato come profilo di riferimento "senza sorprese" da abbinare a
# --profile standard di mdtcap (mdt_configs/profile/standard.conf), per
# un test da 30 minuti con le soglie di default. Un profilo diverso
# (es. "aggressivo", con soglie piu' basse per un test breve mirato a
# scenari specifici) andrebbe aggiunto come nuovo file in questa stessa
# directory, senza toccare main.conf.
