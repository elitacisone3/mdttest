# Profilo scheduler "Default" (DSL, vedi src/mdtmain_lib/profiles.py per
# la sintassi completa: START/IN/EVERY/CHECKPOINT).
#
# Una cattura ogni 25 minuti (PAUSE 0 = nessuna pausa fra un ciclo e
# l'altro), per l'intera giornata, con controlli extra sempre attivi
# (--extra) — stesso comportamento di prima (58 righe "HH:MM HH:MM
# --profile standard --extra" ripetute a mano), espresso con la nuova
# DSL. NOTA: quella vecchia riga ripeteva anche "--profile standard",
# che pero' run_continuous antepone GIA' da solo (["--profile",
# mdtcap_profile_name, ...]) — un secondo "--profile" sulla riga vinceva
# quindi SEMPRE sul profilo mdtcap scelto interattivamente in "Imposta
# test continuato" (l'ultimo argomento passato a mdtcap vince, come
# qualunque parser di argomenti): un bug latente reale, non solo
# cosmetico. Rimosso qui: questa riga usa il profilo mdtcap configurato
# dall'utente, non uno fisso.
EVERY 25 PAUSE 0 IN 00:00 23:59 --extra

# Controllo periodico con allarme (vedi "Abilita la sirena nei
# checkpoint" in Impostazioni/alarmCheckPoint): se nelle ultime 24h (o
# da quando e' suonata l'ultima sirena) c'e' stata un'evidenza
# rilevante, la sirena suona al primo checkpoint utile, una volta sola,
# poi ignora l'intervallo fino a mezzanotte. Stessa finestra oraria del
# vecchio default minAlarmHour=10/maxAlarmHour=23 (usato dall'allarme
# immediato, che resta comunque attivo indipendentemente da questi
# CHECKPOINT).
CHECKPOINT 10:00 14:00
CHECKPOINT 14:00 18:00
CHECKPOINT 18:00 23:00
