# Esempio commentato di file di configurazione per mdtcap, passato con
# --config: elenca TUTTE le impostazioni di TEST utilizzabili in un file
# di questo tipo, con un valore/commento per ciascuna. NON fa parte dello
# schema system.conf/--op/--profile (vedi sotto): questo file da solo
# corrisponde al livello "--config FILE" di mdtcap, il piu' specifico fra
# i tre livelli di configurazione automatica, superato solo dagli
# argomenti passati davvero sulla riga di comando.
#
# NON pensato per essere usato COSI' COM'E' (alcune opzioni sotto sono
# fra loro alternative/mutuamente esclusive, vedi i commenti): e' un
# riferimento da cui copiare le sole righe che servono per il proprio
# --config, non un profilo di test pronto — per quello vedi invece
# mdt_configs/profile/*.conf (es. "standard"/"quick").
#
# Escluse di proposito (parametri di SISTEMA: dipendono dalla
# macchina/dal collegamento hardware, non da un singolo test):
#   --diag-port / --at-port / --autodetect / --autodetect-vendor /
#   --autodetect-model / --usb-modem / --usb-modem-vid / --usb-modem-pid
# Questi vivono in mdt_configs/system.conf, caricato automaticamente da
# mdtcap ad ogni esecuzione (generato/aggiornato con
# "sudo ./install.sh --configure-system"). Se system.conf non esiste
# ancora, aggiungerli qui esplicitamente.
#
# Escluse anche --op/--profile: sono scorciatoie per --config risolte
# SOLO sulla riga di comando vera e propria, non hanno alcun effetto se
# scritte dentro un file --config come questo (mdtcap le ignora,
# "gia' risolte" - vedi mdtcap --help, sezione "--op NOME/--profile
# NOME").

# --outdir-base DIR: dove salvare l'evidenza, in una sottodirectory con
# nome numerico AAAAMMGGhhmmss creata automaticamente. Alternativa a
# --outdir PATH (percorso esatto, senza sottodirectory automatica): sono
# fra loro incompatibili, sceglierne una sola.
--outdir-base /root/mdt_evidence
# --outdir /root/mdt_evidence/test_manuale

--duration 160
--sim-pin 1234

# APN dell'operatore reale della SIM, e forzatura dell'aggancio LTE
# (LTE-only + ciclo CFUN), poi verifica che la cella sia davvero LTE
# prima di avviare la cattura.
--apn iliad
--force-lte
--require-lte
--lte-wait 30

# GPS/GNSS: --gps attiva il log periodico di posizione durante la
# cattura (intervallo --gps-interval, default 30s); --gps-wait attende
# invece un fix PRIMA di iniziare (non bloccante). Indipendenti fra loro
# (si possono usare insieme, singolarmente, o nessuna delle due).
--gps
--gps-interval 30
--gps-wait 30

# Margine di tolleranza (gradi) del bounding box usato dalla scansione
# euristica warnPosD/warnPosL (vedi mdtcap --help).
--lat-margin 0.02
--lon-margin 0.02

# Baud rate della porta AT (default 115200): da cambiare solo se il
# modem/il collegamento seriale lo richiede davvero.
--baud 115200

# Attach dati (PS attach + PDP context), per verifica connessione.
--net-attach-wait 30

# Servizio di localizzazione di rete (LBS), non bloccante.
--lbs

# "Trappola" di riconnessione periodica durante la cattura (ogni
# --reconnect-interval secondi, AT+CFUN=0/1), con un tetto massimo di
# cicli (--reconnects, 0 = nessun tetto). --reconnects non ha effetto
# senza --reconnect-interval.
--reconnect-interval 60
--reconnects 5

# Anteprima "quasi in tempo reale" dei pacchetti decodificati.
# Alternativa a --tui (mutualmente esclusive: usare l'una o l'altra).
-v
--verbose-interval 15
# --tui
# --mdt-led    # ha effetto solo insieme a --tui

# Report finale sintetico Test/Operatore/UE/RRC/MDT/Risultato, frase in
# linguaggio semplice per chi non conosce l'MDT/RRC, e beep di fine
# esecuzione (--beep implica sempre --parla-chiaro).
--report
--parla-chiaro
--beep

# Controlli extra (IMSI-catcher, vedi extra_configs/): --ext-profile non
# ha effetto senza --extended.
--extended
--ext-profile standard

# File di stato "piatti" in tmpfs, utili a un altro processo per
# leggere l'esito senza fare I/O su disco ne' parsare manifest.json.
--shm /dev/shm/mdtcap

# Disabilita il banner iniziale ("MDTCap ver ...").
# --no-banner

# Modalita' "replay" (rilettura di una cattura precedente invece di una
# cattura dal vivo): alternative fra loro e rispetto a TUTTE le opzioni
# di cattura live sopra (porte/PIN/APN/LTE/GPS/attach dati/LBS/-v, tutte
# ignorate in modalita' replay). Solo a scopo illustrativo, NON
# decommentare insieme al resto di questo file.
# --analyze-dlf /percorso/capture_precedente.dlf
# --analyze-pcap /percorso/capture.pcap

--label "esempio di configurazione --config con tutte le impostazioni di test disponibili"
